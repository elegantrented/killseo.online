<!DOCTYPE html>
<html lang="{language}" dir="ltr" prefix="og: https://ogp.me/ns#">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{text} | {site_name}</title>
<meta name="description" content="{about}">
<meta name="keywords" content="{text}, {domain}, {keywords}">
<meta name="author" content="{author}">

<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<meta name="googlebot" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="canonical" href="{page_url}">
<link rel="alternate" hreflang="{language}" href="{page_url}">
<link rel="alternate" hreflang="x-default" href="{page_url}">

<meta property="og:type" content="article">
<meta property="og:site_name" content="{site_name}">
<meta property="og:locale" content="{og_locale}">
<meta property="og:url" content="{page_url}">
<meta property="og:title" content="{text} | {site_name}">
<meta property="og:description" content="{about}">
<meta property="og:image" content="{site_url}og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="{site_name}">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{text} | {site_name}">
<meta name="twitter:description" content="{about}">
<meta name="twitter:image" content="{site_url}og-image.png">
{if twitter}<meta name="twitter:site" content="{twitter}">
{/if}
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="{theme_color}">
<link rel="dns-prefetch" href="//{host}">

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebPage",
      "@id": "{page_url}#webpage",
      "url": "{page_url}",
      "name": "{text} | {site_name}",
      "description": "{about}",
      "inLanguage": "{language}",
      "isPartOf": { "@id": "{site_url}#website" },
      "breadcrumb": { "@id": "{page_url}#breadcrumb" },
      "about": { "@type": "WebSite", "name": "{text}", "url": "{url}" },
      "relatedLink": ["{url}"],
      "primaryImageOfPage": { "@type": "ImageObject", "url": "{site_url}og-image.png" },
      "datePublished": "{published}",
      "dateModified": "{today}"
    },
    {
      "@type": "BreadcrumbList",
      "@id": "{page_url}#breadcrumb",
      "itemListElement": [
        { "@type": "ListItem", "position": 1, "name": "{site_name}", "item": "{site_url}" },
        { "@type": "ListItem", "position": 2, "name": "{text}", "item": "{page_url}" }
      ]
    },
    {
      "@type": "WebSite",
      "@id": "{site_url}#website",
      "url": "{site_url}",
      "name": "{site_name}"
    }
  ]
}
</script>
</head>
<body>

<header>
<p><a href="/">{site_name}</a> &rsaquo; {text}</p>
<h1>{text}</h1>
</header>

<main>
<p>{about}</p>

{if paid_text}<p><strong>{paid_text}</strong></p>
{/if}<p>Website: <a href="{url}"{if link_rel} rel="{link_rel}"{/if}>{text}</a></p>
{if review}<p><a href="{review}" rel="nofollow">{review_text}</a></p>
{/if}

<h2>More sites</h2>
<ul>
{each other}<li><a href="/{slug}/">{text}</a></li>
{/each}</ul>
</main>

<footer>
{if contact_email}<p>{contact_text} <a href="mailto:{contact_email}">{contact_email}</a></p>
{/if}<p>{footer}</p>
</footer>

</body>
</html>
